name: Note 1 jam

# Dipicu oleh cron-job.org (repository_dispatch, tipe forex-scanner), sama seperti sebelumnya.
# Atur jadwal di cron-job.org: disarankan 1 jam sekali (menit ke-5). Tidak membuka entry: hanya peringatan + Discord.
# Trigger schedule tidak dipakai agar tidak ada run ganda.
on:
  repository_dispatch:
    types: [forex-scanner]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: peringatan-1jam
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Ambil data 1 jam
        run: python fetch_1h.py
      - name: Jalankan peringatan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python src/peringatan.py data/1h reports/peringatan_terbaru.md
      - name: Commit laporan
        if: always()
        run: |
          if [ ! -f reports/peringatan_terbaru.md ]; then echo "Tidak ada laporan"; exit 0; fi
          git config user.name "forex-bot"
          git config user.email "forex-bot@users.noreply.github.com"
          git add reports/peringatan_terbaru.md state/peringatan_pantau.json database/peringatan_pemantauan.jsonl
          if git diff --cached --quiet; then echo "Tidak ada perubahan"; exit 0; fi
          git commit -m "peringatan $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin HEAD:main
