name: Forex Screening

# Dipicu oleh cron-job.org (repository_dispatch) atau tombol Run workflow (manual).
on:
  repository_dispatch:
    types: [forex-screening]
  workflow_dispatch:
    inputs:
      pairs:
        description: "Uji coba: pair dipisah koma (kosong = semua pair)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: forex-screening
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Jalankan screening
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          FINEX_REFERENCE_JSON: ${{ secrets.FINEX_REFERENCE_JSON }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_NOTIFY_MODE: ${{ vars.DISCORD_NOTIFY_MODE }}
          PAIRS: ${{ github.event.inputs.pairs || github.event.client_payload.pairs }}
        run: python -m src.main --pairs "$PAIRS"
      - name: Commit state, database, laporan
        if: always()
        run: |
          mkdir -p state database reports
          git config user.name "forex-bot"
          git config user.email "forex-bot@users.noreply.github.com"
          git add -A state database reports
          if ! git diff --cached --quiet; then
            git commit -m "update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi
