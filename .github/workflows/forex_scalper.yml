name: Adaptive Forex Scanner

# Dipicu oleh cron-job.org (repository_dispatch, tiap jam menit ke-5 UTC) atau manual.
# Trigger schedule dihapus agar tidak ada run ganda.
on:
  repository_dispatch:
    types: [forex-scanner]
  workflow_dispatch:
    inputs:
      pairs:
        description: "Uji coba: pair dipisah koma (kosong = semua pair)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: forex-scanner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Jalankan scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_NOTIFY_MODE: ${{ vars.DISCORD_NOTIFY_MODE }}
          PAIRS: ${{ github.event.inputs.pairs || github.event.client_payload.pairs }}
        run: python main.py --pairs "$PAIRS"
      - name: Commit state, database, laporan
        if: always()
        run: |
          mkdir -p state database reports scanner
          git config user.name "forex-bot"
          git config user.email "forex-bot@users.noreply.github.com"
          git add -A state database reports scanner
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan untuk di-commit"
            exit 0
          fi
          git commit -m "update $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              # Konflik hanya pada file hasil bot: pakai versi run ini
              for f in $(git diff --name-only --diff-filter=U); do
                case "$f" in
                  state/*|database/*|reports/*|scanner/*) git checkout --theirs -- "$f"; git add "$f" ;;
                  *) echo "Konflik di luar file bot: $f"; git rebase --abort; exit 1 ;;
                esac
              done
              GIT_EDITOR=true git rebase --continue
            fi
            if git push origin HEAD:main; then
              echo "Push berhasil"
              exit 0
            fi
            echo "Push ditolak, mencoba ulang ($i/3)"
            sleep 5
          done
          echo "Gagal push setelah 3 percobaan"
          exit 1
