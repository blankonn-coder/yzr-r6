name: Adaptive Forex Scanner

# Dipicu otomatis setiap kali workflow "Forex Screening" (forex_scalper.yml) selesai sukses.
# Bisa juga dijalankan manual lewat "Run workflow".
on:
  workflow_run:
    workflows: ["Forex Screening"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adaptive-scanner
  cancel-in-progress: false

jobs:
  scan:
    # Untuk pemicu workflow_run, hanya jalan jika screening lama sukses
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Jalankan scanner
        run: python -m src.scanner.live
      - name: Commit laporan
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/scanner_latest.md results/scanner/latest.json
          git diff --cached --quiet && exit 0
          git commit -m "scanner: laporan terbaru"
          git pull --rebase
          git push
